services:
  # ========================================================
  # GPU Production Service
  # ========================================================
  gpu:
    restart: unless-stopped
    profiles: ["gpu"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu
      target: prod
    image: ${IMAGE_NAME:-vieneu-tts}:${IMAGE_TAG:-latest}
    container_name: vieneu-tts-gpu
    ports:
      - "${PORT:-7860}:7860"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - HF_HOME=/home/app/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - huggingface_cache:/home/app/.cache/huggingface
      - ../output_audio:/workspace/output_audio
    env_file:
      - ../.env
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vieneu-tts.rule=Host(`voice-tts.ngtrac.io.vn`)"
      - "traefik.http.routers.vieneu-tts.entrypoints=web"
      - "traefik.http.routers.vieneu-tts.middlewares=vieneu-tts-auth"
      - "traefik.http.middlewares.vieneu-tts-auth.basicauth.users=thanhnt.usth@gmail.com:$$apr1$$U3w5MtC3$$/cmb6IAqFn.BR2EdvueEx0"
      - "traefik.http.services.vieneu-tts.loadbalancer.server.port=7860"
      - "traefik.docker.network=proxy"

  # ========================================================
  # GPU Production — OpenAI-compatible streaming API (same image, other command)
  #   docker compose -f docker/docker-compose.prod.yml --profile api up
  # ========================================================
  api:
    restart: unless-stopped
    profiles: ["api"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu
      target: prod
    image: ${IMAGE_NAME:-vieneu-tts}:${IMAGE_TAG:-latest}
    container_name: vieneu-tts-api
    command: ["python", "-m", "apps.openai_speech"]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0   # the server defaults to loopback; the published port needs all interfaces
      - PORT=8000
      - VIENEU_MAX_STREAMS=${VIENEU_MAX_STREAMS:-16}
      - VIENEU_QUEUE=${VIENEU_QUEUE:-16}
      - VIENEU_API_KEY=${VIENEU_API_KEY:-}
      - HF_HOME=/home/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - huggingface_cache:/home/app/.cache/huggingface
    env_file:
      - ../.env
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vieneu-api.rule=Host(`api-voice-tts.ngtrac.io.vn`)"
      - "traefik.http.routers.vieneu-api.entrypoints=web"
      - "traefik.http.services.vieneu-api.loadbalancer.server.port=8000"
      - "traefik.docker.network=proxy"

volumes:
  huggingface_cache:

networks:
  proxy:
    external: true

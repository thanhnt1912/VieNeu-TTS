services:
  # ========================================================
  # GPU Production Service
  # ========================================================
  gpu:
    restart: unless-stopped
    profiles: ["gpu"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu
      target: prod
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: vieneu-tts-gpu
    ports:
      - "${PORT}:7860"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /opt/vieneu-caches/huggingface:/root/.cache/huggingface
      - ../output_audio:/workspace/output_audio
    env_file:
      - ../.env
    networks:
      - default
      - traefik_cloudflare
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vieneu-tts.rule=Host(`voice-tts.nguyentracthanh.site`)"
      - "traefik.http.routers.vieneu-tts.entrypoints=web"
      - "traefik.http.routers.vieneu-tts.middlewares=vieneu-tts-auth"
      - "traefik.http.middlewares.vieneu-tts-auth.basicauth.users=thanhnt.usth@gmail.com:$$apr1$$U3w5MtC3$$/cmb6IAqFn.BR2EdvueEx0"
      - "traefik.http.services.vieneu-tts.loadbalancer.server.port=7860"
      - "traefik.docker.network=traefik_cloudflare"
  # ========================================================
  # GPU Production — OpenAI-compatible streaming API (same image, other command)
  #   docker compose -f docker/docker-compose.prod.yml --profile api up
  # ========================================================
  api:
    restart: unless-stopped
    profiles: ["api"]
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: vieneu-tts-api
    command: ["python", "-m", "apps.openai_speech"]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0   # the server defaults to loopback; the published port needs all interfaces
      - PORT=8000
      - VIENEU_MAX_STREAMS=${VIENEU_MAX_STREAMS:-16}
      - VIENEU_QUEUE=${VIENEU_QUEUE:-16}
      - VIENEU_API_KEY=${VIENEU_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    env_file:
      - .env

networks:
  traefik_cloudflare:
    external: true
